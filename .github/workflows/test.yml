name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: check_misread_words self-test
        run: python tools/check_misread_words.py --self-test
      - name: mine_misreads self-test
        run: python tools/mine_misreads.py --self-test
      - name: trace_misreads self-test
        run: python tools/trace_misreads.py --self-test
      - name: probe_misreads self-test
        run: python tools/probe_misreads.py --self-test
